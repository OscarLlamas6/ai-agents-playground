[project]
name = "langgraph-trello-ops-agent"
version = "0.1.0"
description = "Agente de operaciones sobre Trello construido con StateGraph de LangGraph: RAG, memoria, aprobación humana y tope de pasos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.4",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "numpy>=2.0",
    "openai>=1.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "langgraph-cli[inmem]>=0.4"]
mcp = ["langchain-mcp-adapters>=0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
