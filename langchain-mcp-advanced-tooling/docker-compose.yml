# Tres servicios con `docker compose up --build`:
#   mcp  el servidor MCP de HubSpot por Streamable HTTP        http://127.0.0.1:8000/mcp
#   api  FastAPI con el agente (usa el servidor `mcp`)         http://127.0.0.1:8001/docs
#   ui   Streamlit (usa la API)                                 http://127.0.0.1:8510
# Las sesiones se guardan en SQLite dentro del volumen `sessions`: sobreviven a `docker compose restart api`.
#
#   docker compose up --build -d
#   cd bruno && npx @usebruno/cli run --env local          # la colección Bruno contra la API del contenedor
#   docker compose down            # (con -v también borra las sesiones)
name: langchain-mcp-advanced-tooling

# Por defecto TODO es simulado (modelo `fake` y CRM `fake`): determinista, sin llaves y sin costo. Para usar un modelo o
# HubSpot reales, ponlos en el `.env` de ESTA carpeta (LLM_PROVIDER, OPENAI_API_KEY, HUBSPOT_MODE, HUBSPOT_TOKEN...).
x-common: &common
  build: .
  env_file:
    - path: .env
      required: false
  environment: &env
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    HUBSPOT_MODE: ${HUBSPOT_MODE:-fake}

services:
  mcp:
    <<: *common
    command: ["python", "mcp_server.py", "--http"]
    environment:
      <<: *env
      MCP_HOST: 0.0.0.0     # fijo: el .env (MCP_HOST=127.0.0.1) pisaría al del Dockerfile y la API no alcanzaría a este servicio
      MCP_PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  api:
    <<: *common
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *env
      MCP_URL: http://mcp:8000/mcp          # la API habla con el servidor MCP del otro contenedor
      SESSIONS_DB: /data/sessions.db
    volumes: ["sessions:/data"]
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      mcp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  ui:
    <<: *common
    command: ["streamlit", "run", "ui.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      <<: *env
      API_URL: http://api:8001
    ports: ["127.0.0.1:${UI_PORT:-8510}:8501"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  sessions:
