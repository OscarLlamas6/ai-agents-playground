# Linux: el contenedor comparte la red de tu máquina. Así `localhost:1235` ES tu LM Studio aunque este solo escuche en
# 127.0.0.1 (no hace falta activar «Serve on Local Network»).
# Uso:  docker compose -f docker-compose.yml -f docker-compose.host.yml run --rm agent --trace "¿Cómo está la VPN?"
# No funciona en Docker Desktop (Mac/Windows): allí activa «Serve on Local Network» en LM Studio y usa el compose normal.
services:
  agent:
    network_mode: host
    extra_hosts: !reset []
    environment:
      RUNNING_IN_DOCKER: "0"        # con la red del anfitrión, `localhost` ya es correcto: no se traduce
