# n8n local para la Sesión 12. Imagen fijada a la versión estable probada (no uses `latest`).
#
#   docker compose up -d            # n8n en http://localhost:5678
#   docker compose down             # detiene (los datos quedan en el volumen)
#   docker compose down -v          # detiene y BORRA los datos (base, credenciales, ejecuciones)
name: n8n-workflows

services:
  n8n:
    image: n8nio/n8n:2.47.7
    ports:
      - "127.0.0.1:5678:5678"            # solo tu máquina: no expongas n8n a la red sin autenticación ni TLS
    env_file:
      - path: .env
        required: false
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Guatemala
      TZ: America/Guatemala
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-clave-solo-para-el-laboratorio-cambiala}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"      # horas: las ejecuciones se borran a los 7 días
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para llegar a LM Studio o a un servidor MCP que corre en tu máquina
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  n8n_data:
