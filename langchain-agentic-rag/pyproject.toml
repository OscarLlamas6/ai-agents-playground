[project]
name = "langchain-agentic-rag"
version = "0.1.0"
description = "RAG agéntico con LangChain: la búsqueda es una herramienta y el modelo decide cuándo usarla"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.5.1",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.5",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "numpy>=2.0",
    "openai>=1.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
