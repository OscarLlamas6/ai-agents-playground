# https://taskfile.dev · `task` lista las tareas · requiere: uv (Python) y, para Docker, docker compose.
# Las tareas que reciben una pregunta la toman de lo que escribas después de `--`:
#   task trace -- "Olvidé mi contraseña y estoy en casa: ¿cómo la restablezco?"
version: "3"

vars:
  QUESTION: '{{default "¿Cada cuánto vence mi contraseña?" .CLI_ARGS}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Instala las dependencias de Python (incluidas las de pruebas)
    cmds:
      - uv sync

  db:
    desc: Levanta Postgres con pgvector (puerto 5433)
    cmds:
      - docker compose up -d db

  log:
    desc: Muestra la bitácora de consultas y los huecos del manual
    cmds:
      - uv run python cli.py log

  ingest:
    desc: Ingesta del manual en Postgres + pgvector (Click)
    cmds:
      - uv run python cli.py ingest

  ask:
    desc: 'Pregunta al agente (task ask -- "pregunta")'
    cmds:
      - uv run python cli.py ask "{{.QUESTION}}"

  trace:
    desc: 'Pregunta y muestra las herramientas que pidió el agente (task trace -- "pregunta")'
    cmds:
      - uv run python cli.py ask --trace "{{.QUESTION}}"

  chat:
    desc: Conversación con memoria (preguntas de seguimiento)
    interactive: true
    cmds:
      - uv run python cli.py chat --trace

  api:
    desc: La API HTTP (FastAPI) en http://localhost:8000 · documentación en /docs
    cmds:
      - uv run uvicorn api:app --reload

  ui:
    desc: La interfaz Streamlit en http://localhost:8501 (necesita la API corriendo)
    cmds:
      - uv run streamlit run ui.py

  bruno:
    desc: Corre la colección de Bruno contra la API (necesita la API corriendo y Node)
    dir: bruno
    cmds:
      - npx --yes @usebruno/cli@latest run --env local

  test:
    desc: Pruebas sin red (modelo guionado y embeddings falsos)
    cmds:
      - uv run pytest -q

  docker:build:
    desc: Construye la imagen
    cmds:
      - docker compose build

  docker:ask:
    desc: 'El agente en un contenedor, con tu .env (task docker:ask -- "pregunta")'
    cmds:
      - docker compose run --rm agent ask --trace "{{.QUESTION}}"

  docker:chat:
    desc: Conversación con memoria, en un contenedor
    interactive: true
    cmds:
      - docker compose run --rm agent chat --trace

  docker:ask:host:
    desc: "Como docker:ask, pero en la red del anfitrión (solo Linux): alcanza LM Studio en localhost"
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.host.yml run --rm agent ask --trace "{{.QUESTION}}"
